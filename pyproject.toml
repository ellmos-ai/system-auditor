[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-auditor"
version = "0.9.2"
description = "Evidence-based system audits across several machines, with meta bundling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Lukas Geiger" }]
keywords = [
    "audit",
    "audit-report",
    "compliance",
    "cross-platform",
    "drift-detection",
    "ellmos",
    "ellmos-ai",
    "evidence-based",
    "governance",
    "host-inventory",
    "local-first",
    "meta-audit",
    "multi-host",
    "offline-first",
    "open-bricks",
    "quality-assurance",
    "security-audit",
    "system-diagnostics",
    "system-integrity",
    "zero-egress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[project.scripts]
system-auditor = "system_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/system-auditor#readme"
Documentation = "https://github.com/ellmos-ai/system-auditor#readme"
Repository = "https://github.com/ellmos-ai/system-auditor"
Issues = "https://github.com/ellmos-ai/system-auditor/issues"
Changelog = "https://github.com/ellmos-ai/system-auditor/blob/master/CHANGELOG.md"
Contributing = "https://github.com/ellmos-ai/system-auditor/blob/master/CONTRIBUTING.md"
Security = "https://github.com/ellmos-ai/system-auditor/blob/master/SECURITY.md"
Notice = "https://github.com/ellmos-ai/system-auditor/blob/master/NOTICE"
"Level 1 SBOM" = "https://github.com/ellmos-ai/system-auditor/blob/master/THIRD_PARTY_LICENSES.md"
"Level 1 SBOM (Text)" = "https://github.com/ellmos-ai/system-auditor/blob/master/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/ellmos-ai/system-auditor/blob/master/LICENSE"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/system-auditor/blob/master/THIRD_PARTY_LICENSES.txt"
"Marketing Log" = "https://github.com/ellmos-ai/system-auditor/blob/master/MARKETING-LOG.txt"
Umbrella = "https://github.com/open-bricks/open-bricks"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", ".ruff_cache", ".hypothesis", "build", "dist"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
