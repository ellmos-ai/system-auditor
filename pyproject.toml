[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-auditor"
version = "0.9.1"
description = "Evidence-based system audits across several machines, with meta bundling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Geiger" }]
keywords = [
    "audit",
    "system-integrity",
    "multi-host",
    "meta-audit",
    "governance",
    "drift-detection",
    "compliance",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
system-auditor = "system_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/system-auditor"
Documentation = "https://github.com/ellmos-ai/system-auditor#readme"
Repository = "https://github.com/ellmos-ai/system-auditor"
Issues = "https://github.com/ellmos-ai/system-auditor/issues"
Changelog = "https://github.com/ellmos-ai/system-auditor/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/system-auditor/blob/main/SECURITY.md"
Umbrella = "https://github.com/open-bricks/open-bricks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
