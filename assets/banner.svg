<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');

      .font-sans {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      }
      .title-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -1.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .subtitle-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.2px;
      }
      .detail-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 13.5px;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
      }
      .code-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 600;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Accent Radial Gradients -->
    <radialGradient id="glow-cyan" cx="240" cy="150" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-indigo" cx="440" cy="180" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-amber" cx="100" cy="80" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Card Fill & Border Filters/Gradients -->
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glass Cards -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="0" fill="url(#bg-grad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="240" cy="150" r="220" fill="url(#glow-cyan)" />
  <circle cx="440" cy="180" r="200" fill="url(#glow-indigo)" />
  <circle cx="100" cy="80" r="160" fill="url(#glow-amber)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="5" height="300" fill="#38bdf8" />

  <!-- ==================== LEFT DIAGRAM: AUDIT KETTE & BELEGE ==================== -->
  <g transform="translate(45, 30)">

    <!-- Machine Node 1: Laptop -->
    <g transform="translate(0, 15)">
      <rect width="130" height="65" rx="10" fill="url(#glass-card-bg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="8" y="8" width="24" height="24" rx="5" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
      <path d="M14 22 h12 M14 26 h8 M14 18 h10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="24" class="code-label" fill="#38bdf8">LAPTOP-CLIENT</text>
      <text x="38" y="38" font-family="'JetBrains Mono', monospace" font-size="9px" fill="#94a3b8">sys_audit.json</text>
      <!-- Status Chip -->
      <rect x="10" y="44" width="110" height="14" rx="4" fill="#0369a1" fill-opacity="0.3"/>
      <circle cx="18" cy="51" r="3" fill="#38bdf8"/>
      <text x="25" y="54" class="code-label" font-size="8px" fill="#7dd3fc">EVIDENCE: 42 RULES</text>
    </g>

    <!-- Machine Node 2: Workstation -->
    <g transform="translate(0, 145)">
      <rect width="130" height="65" rx="10" fill="url(#glass-card-bg)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="8" y="8" width="24" height="24" rx="5" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-width="1"/>
      <path d="M14 22 h12 M14 26 h8 M14 18 h10" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="24" class="code-label" fill="#818cf8">WORKSTATION-LG</text>
      <text x="38" y="38" font-family="'JetBrains Mono', monospace" font-size="9px" fill="#94a3b8">sys_audit.json</text>
      <!-- Status Chip -->
      <rect x="10" y="44" width="110" height="14" rx="4" fill="#3730a3" fill-opacity="0.3"/>
      <circle cx="18" cy="51" r="3" fill="#818cf8"/>
      <text x="25" y="54" class="code-label" font-size="8px" fill="#c7d2fe">EVIDENCE: 42 RULES</text>
    </g>

    <!-- Audit Flow Rays / Vector Connectors -->
    <!-- Curved Path from Laptop to Evidence Node -->
    <path d="M 130 47 C 165 47, 165 100, 195 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" opacity="0.85"/>
    <circle cx="162" cy="72" r="4" fill="#38bdf8"/>

    <!-- Curved Path from Workstation to Evidence Node -->
    <path d="M 130 177 C 165 177, 165 130, 195 130" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3" opacity="0.85"/>
    <circle cx="162" cy="154" r="4" fill="#818cf8"/>

    <!-- Central Node: Meta-Bundling & Proof Matrix (Glassmorphic Main Card) -->
    <g transform="translate(195, 60)">
      <rect width="185" height="110" rx="12" fill="url(#glass-card-bg)" stroke="url(#glass-border)" stroke-width="1.8" filter="url(#shadow)"/>
      
      <!-- Card Header -->
      <rect x="12" y="10" width="161" height="22" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="23" cy="21" r="4" fill="#34d399" />
      <text x="32" y="25" class="code-label" font-size="9px" fill="#a7f3d0">META-BUNDLING MATRIX</text>
      <text x="145" y="25" class="code-label" font-size="8px" fill="#64748b">v1.0</text>

      <!-- Proof Chain Items -->
      <g transform="translate(12, 40)">
        <!-- Row 1: Evidence Proof -->
        <rect x="0" y="0" width="161" height="18" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="0.7"/>
        <text x="8" y="12" class="code-label" font-size="8.5px" fill="#38bdf8">PROOF#861</text>
        <text x="65" y="12" class="code-label" font-size="8.5px" fill="#94a3b8">sha256:e3b0c442...</text>
        <path d="M148 5 l4 4 l6 -6" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Row 2: Audit Finding Classification -->
        <rect x="0" y="22" width="161" height="18" rx="4" fill="#d97706" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.7"/>
        <text x="8" y="34" class="code-label" font-size="8.5px" fill="#fbbf24">CLASS: DELTA</text>
        <text x="75" y="34" class="code-label" font-size="8.5px" fill="#fde68a">Host-Path Diff</text>
        <rect x="135" y="25" width="20" height="12" rx="3" fill="#f59e0b" fill-opacity="0.3"/>
        <text x="138" y="34" font-family="'JetBrains Mono', monospace" font-size="7.5px" font-weight="700" fill="#fbbf24">DIFF</text>

        <!-- Row 3: Verified Status -->
        <rect x="0" y="44" width="161" height="18" rx="4" fill="#059669" fill-opacity="0.15" stroke="#10b981" stroke-width="0.7"/>
        <text x="8" y="56" class="code-label" font-size="8.5px" fill="#34d399">AUDIT PASSED</text>
        <text x="80" y="56" class="code-label" font-size="8.5px" fill="#a7f3d0">Consensus 100%</text>
        <circle cx="151" cy="53" r="3.5" fill="#34d399"/>
      </g>
    </g>

    <!-- Right Flow Connector to Output Audit Trail Node -->
    <path d="M 380 115 H 410" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5 3"/>
    <polygon points="412,115 405,110 405,120" fill="#34d399"/>

    <!-- Verification Badge (Audit Shield Seal) -->
    <g transform="translate(395, 170)">
      <rect width="42" height="42" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <!-- Shield icon -->
      <path d="M21 10 L31 14 V22 C31 28 21 33 21 33 C21 33 11 28 11 22 V14 L21 10 Z" fill="#064e3b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.5"/>
      <path d="M17 21 L20 24 L25 18" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>

  <!-- Divider Line between Diagram & Branding -->
  <line x1="495" y1="40" x2="495" y2="260" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- ==================== RIGHT BRANDING & INFORMATION ==================== -->
  <g transform="translate(525, 0)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, 48)">
      <rect width="285" height="26" rx="6" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="17" class="badge-text" fill="#7dd3fc">EVIDENCE AUDITS · META-BUNDLING</text>
    </g>

    <!-- Repository Title -->
    <text x="0" y="124" class="title-text" fill="url(#title-grad)">system-auditor</text>

    <!-- German Subtitle / Tagline -->
    <text x="0" y="158" class="subtitle-text" fill="#f1f5f9">Belegbasierte Systemaudits über mehrere Maschinen</text>

    <!-- English / Secondary Line -->
    <text x="0" y="184" class="detail-text" fill="#94a3b8">Multi-machine cross-auditing &amp; deterministic evidence bundling (ausgekapselt aus ticket-master)</text>

    <!-- Feature Pills at Bottom -->
    <g transform="translate(0, 216)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="30" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="14" y="19" class="pill-text" fill="#7dd3fc">🔍 Beleg-Audits</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="155" height="30" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#818cf8" stroke-width="1.2"/>
        <text x="14" y="19" class="pill-text" fill="#c7d2fe">💻 Meta-Bündelung</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(315, 0)">
        <rect width="145" height="30" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2"/>
        <text x="14" y="19" class="pill-text" fill="#a7f3d0">🔗 Audit-Trail</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(470, 0)">
        <rect width="150" height="30" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="14" y="19" class="pill-text" fill="#fde68a">⚡ Standalone</text>
      </g>
    </g>

  </g>
</svg>